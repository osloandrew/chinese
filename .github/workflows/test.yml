name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  asset-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cache-busted asset versions
        run: python3 scripts/stamp-asset-versions.py --check

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  word-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every chineseWords.csv row has a unique id
        run: python3 scripts/check-word-ids.py
